<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企画・展示紹介 - 第70回屋代高校鳩祭公式ウェブサイト</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="css/common.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>

  <style>
    /* ==========================================================================
       🎨 カラー＆デザインシステム（グラフィカル・モダンエディションを完全定着）
       ========================================================================== */
    :root {
      /* メインカラー */
      --color-primary: #2C3A4E;     /* 深みのあるブルーグレー（タイトル・強調） */
      --color-primary-dark: #131924;/* フッター用ダークネイビー */
      --color-key: #8DAE4B;         /* アクセント：新緑のオリーブ黄緑（アクティブ・ホバー） */
      --color-key-light: #F4F8EC;   /* アクセント薄色：タグ背景用 */
      --color-base: #222222;        /* テキスト：チャコールブラック */
      --color-contrast: #E2E8F0;    /* 境界線：ライトグレー */
      --color-white: #ffffff;
      --color-bg-light: #F8FAFC;    /* 全体背景：清潔感のあるライトスレート */
      
      /* シャドウ＆イージング */
      --shadow-sm: 0 4px 12px rgba(44, 58, 78, 0.04);
      --shadow-md: 0 12px 32px rgba(44, 58, 78, 0.08);
      --shadow-lg: 0 20px 40px rgba(44, 58, 78, 0.12);
      --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      font-family: "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
      background-color: var(--color-bg-light);
      color: var(--color-base);
      letter-spacing: 0.04em;
      margin: 0;
      padding: 0;
    }

    /* ① スクロール連動フェードイン（共通アニメーション） */
    .reveal-on-scroll {
      opacity: fadeIn 0.6s ease-out forwards;
      transform: translateY(25px);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .reveal-on-scroll.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ② セクションタイトルのモダン装飾 */
    .section-title-modern {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--color-primary);
      position: relative;
      padding-left: 1rem;
      margin-bottom: 1.5rem;
    }
    .section-title-modern::before {
      content: "";
      position: absolute;
      left: 0; top: 15%; width: 4px; height: 70%;
      background: var(--color-key);
      border-radius: 2px;
    }

    /* 🔍 フィルターセクション（検索窓を除去してスッキリ化） */
    .filter-section {
      background: var(--color-white);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 2.5rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(44, 58, 78, 0.05);
    }
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      align-items: center;
    }
    .filter-group:last-child {
      margin-bottom: 0;
    }
    .filter-label {
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--color-primary);
      min-width: 80px;
      opacity: 0.8;
    }
    .btn-filter {
      background: var(--color-bg-light);
      color: var(--color-primary);
      border: 1px solid var(--color-contrast);
      padding: 0.4rem 1.2rem;
      border-radius: 30px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: var(--transition-smooth);
      width: auto;
      margin: 0;
      font-weight: 600;
    }
    .btn-filter:hover, .btn-filter.active {
      background: var(--color-key) !important;
      color: var(--color-white) !important;
      border-color: transparent !important;
      box-shadow: 0 4px 14px rgba(141, 174, 75, 0.25);
    }

    /* 📦 堅牢な3カラムレスポンシブグリッド（PicoCSSに依存せず美しく並べます） */
    .projects-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin-bottom: 3rem;
    }
    @media (min-width: 576px) {
      .projects-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 992px) {
      .projects-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* 企画カード（インタラクティブ・ホバーリフト） */
    .project-card {
      background: var(--color-white);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(44, 58, 78, 0.03);
      cursor: pointer;
      opacity: 1; /* 初期表示。Anime.js実行時のみ上書き */
      transition: var(--transition-smooth);
      display: flex;
      flex-direction: column;
      height: 100%;
      margin: 0;
    }
    .project-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(141, 174, 75, 0.2);
    }
    .card-thumbnail {
      width: 100%;
      height: 180px;
      background: #e2e8f0;
      position: relative;
      overflow: hidden;
    }
    .card-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .project-card:hover .card-thumbnail img {
      transform: scale(1.04);
    }
    .card-location {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(44, 58, 78, 0.85);
      color: var(--color-white);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.7rem;
      backdrop-filter: blur(4px);
      font-weight: 600;
    }
    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .organizer-badge {
      font-size: 0.75rem;
      color: var(--color-key);
      font-weight: 700;
      margin-bottom: 0.4rem;
    }
    .project-card h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--color-primary);
      margin: 0 0 0.5rem 0;
    }
    .project-card p {
      font-size: 0.85rem;
      color: #555555;
      line-height: 1.5;
      margin: 0 0 1rem 0;
    }
    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: auto;
    }
    .tag-badge {
      background: var(--color-key-light);
      color: var(--color-primary);
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
      border: 1px solid rgba(141, 174, 75, 0.1);
    }

    /* 🪟 詳細モーダル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(19, 25, 36, 0.4);
      backdrop-filter: blur(10px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      padding: 1rem;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-window {
      background: var(--color-white);
      width: 100%;
      max-width: 600px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(44, 58, 78, 0.05);
    }
    .modal-header-img {
      width: 100%;
      height: 220px;
      position: relative;
      background: #e2e8f0;
    }
    .modal-header-img img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .modal-close-btn {
      position: absolute;
      top: 15px; right: 15px;
      background: rgba(44, 58, 78, 0.7);
      color: var(--color-white); border: none;
      width: 32px; height: 32px;
      border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; margin: 0; padding: 0;
      transition: var(--transition-smooth);
    }
    .modal-close-btn:hover { background: var(--color-primary); }
    .modal-body {
      padding: 1.75rem;
      max-height: 60vh;
      overflow-y: auto;
    }
    .modal-meta-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin: 1.25rem 0;
      background: var(--color-bg-light);
      padding: 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
    }
    .modal-meta-item strong {
      display: block;
      color: var(--color-primary);
      font-size: 0.75rem;
      margin-bottom: 0.2rem;
      opacity: 0.8;
    }
    .notice-box {
      background: #fff5f5;
      border-left: 4px solid #ef4444;
      color: #b91c1c;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-top: 1rem;
      font-weight: 600;
    }
    .no-results {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--color-primary);
      opacity: 0.6;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="header-title">
        <h1>🕊️ 第70回屋代高校鳩祭</h1>
        <p>6月27日(土)・28日(日)</p>
      </div>
      <button class="menu-toggle" id="menuToggle">
        <span></span><span></span><span></span>
      </button>
    </div>
    <nav id="navMenu">
      <a href="index.html#exhibitions">企画展示</a>
      <a href="index.html#visitor">来場者向け</a>
      <a href="about.html">鳩祭について</a>
      <a href="index.html#contact">お問い合わせ</a>
      <a href="index.html#sitemap">サイトマップ</a>
    </nav>
  </header>

  <main style="padding-top: 2rem;">
    <section class="reveal-on-scroll" style="margin-bottom: 2rem;">
      <h3 class="section-title-modern">✨ 企画・展示紹介</h3>
      <p>各クラス、班、委員会が創意工夫を凝らして準備した鳩祭の全企画です。気になるカテゴリやタグを選んで、直感的に絞り込んでみましょう！</p>
    </section>

    <div class="filter-section reveal-on-scroll">
      <div class="filter-group">
        <span class="filter-label">カテゴリ</span>
        <button class="btn-filter active" data-filter-type="category" data-value="all">すべて</button>
        <button class="btn-filter" data-filter-type="category" data-value="attraction">アトラクション</button>
        <button class="btn-filter" data-filter-type="category" data-value="exhibition">展示・体験</button>
        <button class="btn-filter" data-filter-type="category" data-value="food">飲食出店</button>
      </div>

      <div class="filter-group" id="tagFilterContainer">
        <span class="filter-label">タグ</span>
        <button class="btn-filter active" data-filter-type="tag" data-value="all">すべて</button>
        </div>
    </div>

    <div class="projects-grid" id="projectsGrid">
      </div>
    
    <div id="noResultsMessage" class="no-results" style="display: none;">
      該当する企画が見つかりませんでした。別の条件を選択してみてください。
    </div>
  </main>

  <div class="modal-overlay" id="projectModal">
    <div class="modal-window" id="modalWindow">
      <div class="modal-header-img">
        <img id="modalImg" src="" alt="企画画像">
        <button class="modal-close-btn" id="modalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="organizer-badge" id="modalOrganizer"></div>
        <h3 id="modalTitle" style="margin-bottom: 0.5rem; color: var(--color-primary);"></h3>
        <div id="modalTags" style="display:flex; gap:0.35rem; margin-bottom:1rem;"></div>
        
        <p id="modalDescription" style="font-size: 0.9rem; color: var(--color-base); margin-bottom: 1.5rem;"></p>
        
        <div class="modal-meta-grid">
          <div class="modal-meta-item">
            <strong>📍 開催場所</strong>
            <span id="modalLocation"></span>
          </div>
          <div class="modal-meta-item">
            <strong>⏱️ 所要時間 / 目安</strong>
            <span id="modalDuration"></span>
          </div>
          <div class="modal-meta-item" style="grid-column: span 2;">
            <strong>🎟️ 整理券・チケット情報</strong>
            <span id="modalTicket"></span>
          </div>
        </div>
        
        <div class="notice-box" id="modalNoticeBox" style="display: none;">
          <span id="modalNotice"></span>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p><strong>第70回屋代高校鳩祭 公式ウェブサイト</strong><br>屋代高等学校鳩祭実行委員会</p>
    <p>© 2026 Yashiro High School Hatosai Festival</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/animejs/dist/bundles/anime.umd.min.js"></script>
  <script src="js/common.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      
      // ==========================================================================
      // 🛠️ メンテナンス・将来の添加用：企画データプール
      // ==========================================================================
      let allProjects = [];
      let currentCategory = 'all';
      let currentTag = 'all';

      const gridContainer = document.getElementById("projectsGrid");
      const noResults = document.getElementById("noResultsMessage");

      // 1. exhibit.json からデータを取得（失敗時はセーフティ用に直書きプールに切り替え）
      fetch('exhibit.json')
        .then(response => {
          if (!response.ok) throw new Error('Network response was not ok');
          return response.json();
        })
        .then(data => {
          allProjects = data;
          initSystem();
        })
        .catch(error => {
          console.warn('exhibit.jsonの取得に失敗したかローカル検証環境のため、下記の定義データを使用します。');
          
          /* 💡 今後、JSONを使わずにHTML直書きで管理したくなった場合は、
               この配列の中にオブジェクトを自由に追加・変更してください！ */
          allProjects = [
            { 
              "id": "event-001", 
              "title": "戦慄！暗闇の迷宮", 
              "organizer": "2年1組", 
              "category": "attraction", 
              "tags": ["お化け屋敷", "体験型", "スリル"], 
              "location": "南校舎2階 204教室", 
              "image": "assets/images/events/2b-obake.webp",
              "description": "今年の2Bは一味違う！過去最高の恐怖をお届けします...", 
              "duration": "1回あたり約10分", 
              "ticket_info": "当日朝9:30より教室前にて整理券を配布（先着100名）", 
              "notice": "※心臓の弱い方、未就学児をお連れの方はご遠慮ください。教室内は大変暗くなっています。" 
            },
            { 
              "id": "event-002", 
              "title": "神秘の森", 
              "organizer": "3年A組", 
              "category": "attraction", 
              "tags": ["自然", "体験型", "癒し"], 
              "location": "北校舎1階 101教室", 
              "image": "assets/images/events/3a-forest.webp",
              "description": "自然と触れ合う体験型展示。森の奥深くで出会う不思議な存在たち。", 
              "duration": "1回あたり約15分", 
              "ticket_info": "当日朝9:30より教室前にて整理券を配布（先着100名）", 
              "notice": "※小学生以下のお子様は保護者同伴でご参加ください。教室内は暗くなっています。" 
            }
          ];
          initSystem();
        });

      // システムの起動初期化
      function initSystem() {
        generateTagFilters(allProjects);
        renderProjects();
        initScrollReveal(); // スクロール監視の開始
      }

      // 2. 全データからタグを一括抽出してフィルターボタンを自動生成
      function generateTagFilters(projects) {
        const tagSet = new Set();
        projects.forEach(p => {
          if (p.tags) p.tags.forEach(t => tagSet.add(t));
        });
        
        const container = document.getElementById("tagFilterContainer");
        tagSet.forEach(tag => {
          const btn = document.createElement("button");
          btn.className = "btn-filter";
          btn.dataset.filterType = "tag";
          btn.dataset.value = tag;
          btn.textContent = tag;
          container.appendChild(btn);
        });

        // 全ボタンにイベントを割り当て
        document.querySelectorAll('.btn-filter').forEach(btn => {
          btn.addEventListener('click', handleFilterClick);
        });
      }

      // 3. フィルターが押された時の挙動
      function handleFilterClick(e) {
        const btn = e.target;
        const type = btn.dataset.filterType;
        const value = btn.dataset.value;

        document.querySelectorAll(`.btn-filter[data-filter-type="${type}"]`).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if (type === 'category') currentCategory = value;
        if (type === 'tag') currentTag = value;

        renderProjects();
      }

      // 4. 条件抽出と画面への安全な描画（Anime.jsによるStagger制御）
      function renderProjects() {
        gridContainer.innerHTML = "";
        
        // 検索窓をなくし、カテゴリとタグだけで美しく絞り込みます
        const filtered = allProjects.filter(p => {
          const matchCategory = (currentCategory === 'all' || p.category === currentCategory);
          const matchTag = (currentTag === 'all' || (p.tags && p.tags.includes(currentTag)));
          return matchCategory && matchTag;
        });

        if (filtered.length === 0) {
          noResults.style.display = "block";
          return;
        }
        noResults.style.display = "none";

        filtered.forEach(p => {
          const card = document.createElement("div");
          card.className = "project-card";
          
          const imgSrc = p.image ? p.image : 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=600&auto=format&fit=crop&q=60';
          
          let tagsHtml = '';
          if(p.tags) {
            p.tags.forEach(t => { tagsHtml += `<span class="tag-badge">#${t}</span>`; });
          }

          card.innerHTML = `
            <div class="card-thumbnail">
              <img src="${imgSrc}" alt="${p.title}" onerror="this.src='https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=600&auto=format&fit=crop&q=60'">
              <div class="card-location">📍 ${p.location}</div>
            </div>
            <div class="card-body">
              <div class="organizer-badge">${p.organizer}</div>
              <h3>${p.title}</h3>
              <p>${p.description}</p>
              <div class="tag-container">${tagsHtml}</div>
            </div>
          `;

          card.addEventListener("click", () => openModal(p));
          gridContainer.appendChild(card);
        });

        document.querySelectorAll('.project-card').forEach(el=>{
          //el.style.opacity='0';
          el.style.transform='translateY(25px)';
        });

        // ✨ Anime.js: 再描写されたカードたちを左上から順番にリズムよくフワッと表示
        anime({
          targets: '.project-card',
          opacity: [0, 1],
          translateY: [25, 0],
          delay: anime.stagger(60),
          duration: 500,
          easing: 'easeOutCubic'
        });
      }

      // 5. 🪟 モーダル詳細ウィンドウの開閉（Anime.jsポップ演出）
      const modal = document.getElementById("projectModal");
      const modalWindow = document.getElementById("modalWindow");

      function openModal(project) {
        const imgSrc = project.image ? project.image : 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=600&auto=format&fit=crop&q=60';
        document.getElementById("modalImg").src = imgSrc;
        document.getElementById("modalOrganizer").textContent = project.organizer;
        document.getElementById("modalTitle").textContent = project.title;
        document.getElementById("modalDescription").textContent = project.description;
        document.getElementById("modalLocation").textContent = project.location;
        document.getElementById("modalDuration").textContent = project.duration || '自由観覧';
        document.getElementById("modalTicket").textContent = project.ticket_info || 'なし（直接会場にお越しください）';
        
        const tagsContainer = document.getElementById("modalTags");
        tagsContainer.innerHTML = '';
        if(project.tags) {
          project.tags.forEach(t => {
            tagsContainer.innerHTML += `<span class="tag-badge">#${t}</span>`;
          });
        }

        const noticeBox = document.getElementById("modalNoticeBox");
        if (project.notice) {
          document.getElementById("modalNotice").textContent = project.notice;
          noticeBox.style.display = "block";
        } else {
          noticeBox.style.display = "none";
        }

        modal.classList.add("active");

        // ✨ Anime.js: モーダルが心地よく弾むポップアップエフェクト
        anime({
          targets: '#modalWindow',
          translateY: [40, 0],
          scale: [0.95, 1],
          opacity: [0, 1],
          duration: 400,
          easing: 'easeOutQuad'
        });
      }

      function closeModal() {
        anime({
          targets: '#modalWindow',
          translateY: [0, 20],
          opacity: [1, 0],
          scale: [1, 0.97],
          duration: 200,
          easing: 'easeInQuad',
          complete: () => {
            modal.classList.remove("active");
            modalWindow.style.opacity='';
            modalWindow.style.transform='';
          }
        });
      }

      document.getElementById("modalClose").addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => { if(e.target === modal) closeModal(); });

      // ==========================================================================
      // 🔄 スクロール連動エフェクト用（Intersection Observer）
      // ==========================================================================
      function initScrollReveal() {
        const observerOptions = { root: null, rootMargin: "0px", threshold: 0.05 };
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              observer.unobserve(entry.target);
            }
          });
        }, observerOptions);

        document.querySelectorAll(".reveal-on-scroll").forEach(el => observer.observe(el));
      }
    });
  </script>
</body>
</html>
