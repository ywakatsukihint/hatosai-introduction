<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企画・展示紹介 - 第70回屋代高校鳩祭公式ウェブサイト</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  
  <link rel="stylesheet" href="css/common.css">

  <style>
    /* ==========================================================================
       展示ページ固有のカスタマイズスタイル
       ========================================================================== */
    body {
      background: #f1f5f9; /* 共通に合わせた背景 */
    }

    /* 検索・フィルターエリアのスタイリング */
    .filter-section {
      background: white;
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 2.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.02);
    }
    .search-box {
      margin-bottom: 1.5rem;
    }
    .search-box input {
      border-radius: 12px;
      padding: 0.75rem 1rem;
      border: 2px solid #e2e8f0;
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    .search-box input:focus {
      border-color: #667eea;
      box-shadow: none;
    }
    
    /* フィルターボタン群 */
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      align-items: center;
    }
    .filter-label {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-sub);
      min-width: 70px;
    }
    .btn-filter {
      background: #f8fafc;
      color: var(--text-main);
      border: 1px solid #e2e8f0;
      padding: 0.4rem 1rem;
      border-radius: 30px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      width: auto;
      margin: 0;
    }
    .btn-filter:hover, .btn-filter.active {
      background: var(--primary-grad);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
    }

    /* 企画カードの拡張 */
    .project-card {
      cursor: pointer;
      opacity: 0; /* JS（Anime.js）でふわっと出すため初期値は0 */
    }
    .card-thumbnail {
      width: 100%;
      height: 180px;
      background: #e2e8f0;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
    }
    .card-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-location {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.75);
      color: white;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      backdrop-filter: blur(4px);
      font-weight: 600;
    }
    .organizer-badge {
      font-size: 0.8rem;
      color: #4f46e5;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: auto;
      padding-top: 1rem;
    }
    .tag-badge {
      background: #dee2ff;
      color: #4f46e5;
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
    }

    /* モーダル（詳細ポップアップ） */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 1rem;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-window {
      background: white;
      width: 100%;
      max-width: 640px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      transform: translateY(40px) scale(0.95);
    }
    .modal-header-img {
      width: 100%;
      height: 240px;
      background: #e2e8f0;
      position: relative;
    }
    .modal-header-img img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .modal-close-btn {
      position: absolute;
      top: 15px; right: 15px;
      background: rgba(0,0,0,0.5);
      color: white; border: none;
      width: 36px; height: 36px;
      border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem; font-weight: bold; margin: 0; padding: 0;
    }
    .modal-close-btn:hover { background: rgba(0,0,0,0.8); }
    .modal-body {
      padding: 2rem;
      max-height: 60vh;
      overflow-y: auto;
    }
    .modal-meta-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin: 1rem 0;
      background: #f8fafc;
      padding: 1rem;
      border-radius: 12px;
      font-size: 0.9rem;
    }
    .modal-meta-item strong {
      display: block;
      color: var(--text-sub);
      font-size: 0.75rem;
      margin-bottom: 0.15rem;
    }
    .notice-box {
      background: #fff5f5;
      border-left: 4px solid #ef4444;
      color: #b91c1c;
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 1rem;
      font-weight: 600;
    }

    /* エラー・件数ゼロ通知 */
    .no-results {
      text-align: center;
      padding: 3rem;
      color: var(--text-sub);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="header-title">
        <h1>🕊️ 第70回屋代高校鳩祭</h1>
        <p>6月27日(土)・28日(日)</p>
      </div>
      <button class="menu-toggle" id="menuToggle">
        <span></span><span></span><span></span>
      </button>
    </div>
    <nav id="navMenu">
      <a href="index.html#exhibitions">企画展示</a>
      <a href="index.html#visitor">来場者向け</a>
      <a href="about.html">鳩祭について</a>
      <a href="index.html#contact">お問い合わせ</a>
      <a href="index.html#sitemap">サイトマップ</a>
    </nav>
  </header>

  <main>
    <section style="margin-bottom: 2rem;">
      <h3 class="section-title">✨ 企画・展示紹介</h3>
      <p>各クラス、班、委員会が創意工夫を凝らして準備した鳩祭の全企画から、あなたの気になる企画を探してみましょう！</p>
    </section>

    <div class="filter-section">
      <div class="search-box">
        <input type="text" id="keywordSearch" placeholder="🔍 企画名、主催団体、キーワードで検索...">
      </div>
      
      <div class="filter-group">
        <span class="filter-label">カテゴリ</span>
        <button class="btn-filter active" data-filter-type="category" data-value="all">すべて</button>
        <button class="btn-filter" data-filter-type="category" data-value="attraction">アトラクション</button>
        <button class="btn-filter" data-filter-type="category" data-value="exhibition">展示・体験</button>
        <button class="btn-filter" data-filter-type="category" data-value="food">飲食出店</button>
      </div>

      <div class="filter-group" id="tagFilterContainer">
        <span class="filter-label">タグ</span>
        <button class="btn-filter active" data-filter-type="tag" data-value="all">すべて</button>
        </div>
    </div>

    <div class="grid cols-3" id="projectsGrid">
      </div>
    <div id="noResultsMessage" class="no-results" style="display: none;">
      該当する企画が見つかりませんでした。別の条件を試してみてください。
    </div>
  </main>

  <div class="modal-overlay" id="projectModal">
    <div class="modal-window" id="modalWindow">
      <div class="modal-header-img">
        <img id="modalImg" src="" alt="企画画像">
        <button class="modal-close-btn" id="modalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="organizer-badge" id="modalOrganizer"></div>
        <h3 id="modalTitle" style="margin-bottom: 0.5rem;"></h3>
        <div id="modalTags" style="display:flex; gap:0.35rem; margin-bottom:1rem;"></div>
        
        <p id="modalDescription" style="font-size: 1rem; color: var(--text-main); margin-bottom: 1.5rem;"></p>
        
        <div class="modal-meta-grid">
          <div class="modal-meta-item">
            <strong>📍 開催場所</strong>
            <span id="modalLocation"></span>
          </div>
          <div class="modal-meta-item">
            <strong>⏱️ 所要時間 / 目安</strong>
            <span id="modalDuration"></span>
          </div>
          <div class="modal-meta-item" style="grid-column: span 2;">
            <strong>🎟️ 整理券・チケット情報</strong>
            <span id="modalTicket"></span>
          </div>
        </div>
        
        <div class="notice-box" id="modalNoticeBox" style="display: none;">
          <span id="modalNotice"></span>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-container">
      <div class="footer-bottom">
        <p><strong>第70回屋代高校鳩祭 公式ウェブサイト</strong><br>屋代高等学校鳩祭実行委員会</p>
        <p>© 2026 Yashiro High School Hatosai Festival</p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/animejs/dist/bundles/anime.umd.min.js"></script>
  <script src="js/common.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let allProjects = [];
      let currentCategory = 'all';
      let currentTag = 'all';
      let currentKeyword = '';

      const gridContainer = document.getElementById("projectsGrid");
      const noResults = document.getElementById("noResultsMessage");

      // 1. exhibit.jsonからデータを非同期取得
      fetch('exhibit.json')
        .then(response => {
          if (!response.ok) throw new Error('Network response was not ok');
          return response.json();
        })
        .then(data => {
          allProjects = data;
          generateTagFilters(data);
          renderProjects();
        })
        .catch(error => {
          console.error('データの読み込みに失敗したため、モックデータを使用します:', error);
          // 万が一JSONのフェッチに失敗した場合のセーフティネット
          allProjects = [
            { "id": "event-001", "title": "戦慄！暗闇の迷宮", "organizer": "2年1組", "category": "attraction", "tags": ["お化け屋敷", "体験型", "スリル"], "location": "南校舎2階 204教室", "description": "今年の2Bは一味違う！過去最高の恐怖をお届けします...", "duration": "1回あたり約10分", "ticket_info": "当日朝9:30より教室前にて整理券を配布", "notice": "教室内は大変暗くなっています。" },
            { "id": "event-002", "title": "神秘の森", "organizer": "3年A組", "category": "attraction", "tags": ["自然", "体験型", "癒し"], "location": "北校舎1階 101教室", "description": "自然と触れ合う体験型展示。森の奥深くで出会う不思議な存在たち。", "duration": "1回あたり約15分", "ticket_info": "当日朝9:30より教室前にて整理券を配布", "notice": "教室内は暗くなっています。" }
          ];
          generateTagFilters(allProjects);
          renderProjects();
        });

      // 2. データ内のすべての「タグ」を自動で重複なく抽出してフィルターを作る
      function generateTagFilters(projects) {
        const tagSet = new Set();
        projects.forEach(p => {
          if (p.tags) p.tags.forEach(t => tagSet.add(t));
        });
        
        const container = document.getElementById("tagFilterContainer");
        tagSet.forEach(tag => {
          const btn = document.createElement("button");
          btn.className = "btn-filter";
          btn.dataset.filterType = "tag";
          btn.dataset.value = tag;
          btn.textContent = tag;
          container.appendChild(btn);
        });

        // 生成したボタンにイベントを設定
        document.querySelectorAll('.btn-filter').forEach(btn => {
          btn.addEventListener('click', handleFilterClick);
        });
      }

      // 3. フィルターボタンがクリックされた時の処理
      function handleFilterClick(e) {
        const btn = e.target;
        const type = btn.dataset.filterType;
        const value = btn.dataset.value;

        // 同じグループのボタンのアクティブ状態を解除
        document.querySelectorAll(`.btn-filter[data-filter-type="${type}"]`).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if (type === 'category') currentCategory = value;
        if (type === 'tag') currentTag = value;

        renderProjects();
      }

      // 4. キーボード入力（リアルタイム検索）の検知
      document.getElementById("keywordSearch").addEventListener("input", (e) => {
        currentKeyword = e.target.value.toLowerCase().trim();
        renderProjects();
      });

      // 5. 条件に合う企画を絞り込んで画面にレンダリング＆Anime.jsによる演出
      function renderProjects() {
        gridContainer.innerHTML = "";
        
        // 条件でフィルタリング
        const filtered = allProjects.filter(p => {
          const matchCategory = (currentCategory === 'all' || p.category === currentCategory);
          const matchTag = (currentTag === 'all' || (p.tags && p.tags.includes(currentTag)));
          const matchKeyword = (!currentKeyword || 
            p.title.toLowerCase().includes(currentKeyword) || 
            p.organizer.toLowerCase().includes(currentKeyword) || 
            p.description.toLowerCase().includes(currentKeyword) ||
            p.location.toLowerCase().includes(currentKeyword)
          );
          return matchCategory && matchTag && matchKeyword;
        });

        // 該当がない場合
        if (filtered.length === 0) {
          noResults.style.display = "block";
          return;
        }
        noResults.style.display = "none";

        // カードのHTML組み立て
        filtered.forEach(p => {
          const card = document.createElement("div");
          card.className = "card project-card";
          
          // 画像がなかった場合のプレースホルダー処理
          const imgSrc = p.image ? p.image : 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=600&auto=format&fit=crop&q=60';
          
          let tagsHtml = '';
          if(p.tags) {
            p.tags.forEach(t => { tagsHtml += `<span class="tag-badge">#${t}</span>`; });
          }

          card.innerHTML = `
            <div class="card-thumbnail">
              <img src="${imgSrc}" alt="${p.title}" onerror="this.src='https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=600&auto=format&fit=crop&q=60'">
              <div class="card-location">📍 ${p.location}</div>
            </div>
            <div class="card-body">
              <div class="organizer-badge">${p.organizer}</div>
              <h3>${p.title}</h3>
              <p>${p.description}</p>
              <div class="tag-container">${tagsHtml}</div>
            </div>
          `;

          // カードクリックでモーダルを開くイベント
          card.addEventListener("click", () => openModal(p));
          gridContainer.appendChild(card);
        });

        // ✨ Anime.js: 新しく描写されたカードを時間差（Stagger）でフワッと表示
        anime({
          targets: '.project-card',
          opacity: [0, 1],
          translateY: [20, 0],
          delay: anime.stagger(80), // 80ミリ秒ずつズラして表示
          duration: 600,
          easing: 'outCubic'
        });
      }

      // 6. 🪟 モーダルウィンドウの開閉処理（Anime.jsアニメーション）
      const modal = document.getElementById("projectModal");
      const modalWindow = document.getElementById("modalWindow");

      function openModal(project) {
        // モーダル内テキストの書き換え
        const imgSrc = project.image ? project.image : 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=600&auto=format&fit=crop&q=60';
        document.getElementById("modalImg").src = imgSrc;
        document.getElementById("modalOrganizer").textContent = project.organizer;
        document.getElementById("modalTitle").textContent = project.title;
        document.getElementById("modalDescription").textContent = project.description;
        document.getElementById("modalLocation").textContent = project.location;
        document.getElementById("modalDuration").textContent = project.duration || 'なし';
        document.getElementById("modalTicket").textContent = project.ticket_info || 'なし';
        
        // タグの展開
        const tagsContainer = document.getElementById("modalTags");
        tagsContainer.innerHTML = '';
        if(project.tags) {
          project.tags.forEach(t => {
            tagsContainer.innerHTML += `<span class="tag-badge">#${t}</span>`;
          });
        }

        // 注意事項がある場合のみボックスを表示
        const noticeBox = document.getElementById("modalNoticeBox");
        if (project.notice) {
          document.getElementById("modalNotice").textContent = project.notice;
          noticeBox.style.display = "block";
        } else {
          noticeBox.style.display = "none";
        }

        // オーバーレイをアクティブに
        modal.classList.add("active");

        // ✨ Anime.js: モーダルが内側からバウンドして広がるような演出
        anime({
          targets: '#modalWindow',
          translateY: [50, 0],
          scale: [0.92, 1],
          opacity: [0, 1],
          duration: 450,
          easing: 'outElastic(1, .8)'
        });
      }

      function closeModal() {
        // ✨ Anime.js: 閉じるときはスッと下に落ちる演出
        anime({
          targets: '#modalWindow',
          translateY: [0, 30],
          opacity: [1, 0],
          scale: [1, 0.95],
          duration: 250,
          easing: 'inCubic',
          complete: () => {
            modal.classList.remove("active");
          }
        });
      }

      document.getElementById("modalClose").addEventListener("click", closeModal);
      // 背景クリックでも閉じられるように
      modal.addEventListener("click", (e) => {
        if(e.target === modal) closeModal();
      });
    });
  </script>
</body>
</html>
