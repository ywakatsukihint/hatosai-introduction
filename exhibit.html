<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>クラス・班企画一覧 - 第70回屋代高校鳩祭公式ウェブサイト</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link rel="stylesheet" href="css/common.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

  <style>
    /* ==========================================================================
       🎨 1. カラー＆デザインシステム（index.html完全同期）
       ========================================================================== */
    :root {
      --color-primary: #2C3A4E;     
      --color-primary-dark: #131924;
      --color-key: #8DAE4B;         
      --color-key-light: #F4F8EC;   
      --color-base: #222222;        
      --color-contrast: #E2E8F0;    
      --color-white: #ffffff;
      --color-bg-light: #F8FAFC;    
      --font-noto: "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0; padding: 0;
      font-family: var(--font-noto);
      background-color: var(--color-bg-light);
      color: var(--color-base);
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* ==========================================================================
       🌐 2. ヘッダー ＆ ナビゲーション
       ========================================================================== */
    .main-header-modern {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(44, 58, 78, 0.08);
      position: sticky; top: 0; z-index: 1000; padding: 0.8rem 1.5rem;
    }
    .header-content {
      max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;
    }
    .header-title { text-decoration: none; }
    .header-title h1 { font-size: 1.3rem; margin: 0; font-weight: 900; color: var(--color-primary); letter-spacing: 0.1em; }
    .header-title p { margin: 0; font-size: 0.7rem; font-weight: 700; color: var(--color-key); text-transform: uppercase; }

    .pc-nav { display: none; }
    .pc-nav-links { display: flex; list-style: none; margin: 0; padding: 0; gap: 2.2rem; }
    .pc-nav-links a { color: var(--color-primary); text-decoration: none; font-weight: 800; font-size: 0.9rem; position: relative; padding: 0.4rem 0; transition: all 0.3s; }
    .pc-nav-links a::after { content: ""; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background-color: var(--color-key); transition: all 0.3s; }
    .pc-nav-links a:hover, .pc-nav-links a.active { color: var(--color-key); }
    .pc-nav-links a:hover::after, .pc-nav-links a.active::after { width: 100%; }

    .menu-trigger { background: none; border: none; width: 44px; height: 44px; position: relative; cursor: pointer; padding: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; }
    .menu-trigger span { display: block; width: 24px; height: 2px; background-color: var(--color-primary); transition: all 0.3s; }
    .menu-trigger.is-active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .menu-trigger.is-active span:nth-child(2) { opacity: 0; }
    .menu-trigger.is-active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

    .fullscreen-nav {
      position: absolute; top: 100%; right: 1.5rem; width: calc(100% - 3rem); max-width: 320px;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-radius: 16px;
      padding: 1.25rem; box-shadow: 0 20px 40px rgba(44, 58, 78, 0.12); border: 1px solid rgba(44, 58, 78, 0.08);
      opacity: 0; pointer-events: none; transform: translateY(-10px) scale(0.95); transition: all 0.3s; z-index: 1050;
    }
    .fullscreen-nav.is-open { pointer-events: auto; opacity: 1; transform: translateY(0) scale(1); }
    .nav-links { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; list-style: none; padding: 0; margin: 0; text-align: center; }
    .nav-links a { color: var(--color-primary); font-size: 0.85rem; font-weight: 800; text-decoration: none; padding: 0.8rem 0.5rem; display: block; background: rgba(44, 58, 78, 0.03); border-radius: 10px; }

    @media (min-width: 992px) { .pc-nav { display: block; } .menu-trigger { display: none; } .fullscreen-nav { display: none !important; } }

    /* ==========================================================================
       📋 3. 企画リスト レイアウト
       ========================================================================== */
    .page-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.25rem 6rem 1.25rem;
    }

    .page-hero { text-align: center; margin-bottom: 2rem; }
    .page-hero h2 { font-size: 2rem; font-weight: 900; color: var(--color-primary); margin: 0 0 0.5rem 0; letter-spacing: 0.05em; }
    .page-hero p { font-size: 0.95rem; color: #64748B; font-weight: 600; margin: 0; }

    /* 学年フィルタータブ */
    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .filter-tab-btn {
      background: var(--color-white);
      border: 1px solid var(--color-contrast);
      color: var(--color-primary);
      padding: 0.6rem 1.2rem;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .filter-tab-btn:hover { border-color: var(--color-key); color: var(--color-key); }
    .filter-tab-btn.active {
      background: var(--color-key);
      color: var(--color-white);
      border-color: var(--color-key);
      box-shadow: 0 4px 12px rgba(141, 174, 75, 0.3);
    }

    /* 📌 リストのスタイリング（無骨なボーダーをなくし、洗練された下線区切りに） */
    .exhibit-list {
      display: flex;
      flex-direction: column;
    }
    .exhibit-row {
      display: flex;
      align-items: flex-start;
      padding: 1.5rem 1rem;
      border-bottom: 1px solid var(--color-contrast);
      cursor: pointer;
      transition: all 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .exhibit-row:last-child {
      border-bottom: none;
    }
    .exhibit-row:hover {
      background: var(--color-white); /* ホバーでスッと白く浮かび上がる */
      border-radius: 12px;
      border-bottom-color: transparent;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      transform: translateY(-2px);
    }

    /* 学年ごとに色が変わるグラデーションバッジ（ワクワク感の演出） */
    .row-badge {
      flex-shrink: 0;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.1rem;
      margin-right: 1.25rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    /* 学年別テーマカラー */
    .badge-high1 { background: linear-gradient(135deg, #e0f2fe, #bae6fd); color: #0284c7; }
    .badge-high2 { background: linear-gradient(135deg, #fef08a, #fde047); color: #a16207; }
    .badge-high3 { background: linear-gradient(135deg, #fce7f3, #fbcfe8); color: #be185d; }
    .badge-jhs   { background: linear-gradient(135deg, #dcfce7, #bbf7d0); color: #15803d; }

    .row-content {
      flex: 1;
      min-width: 0; /* テキストのあふれ防止 */
    }
    .row-title {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--color-primary-dark);
      margin: 0 0 0.4rem 0;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .row-desc {
      font-size: 0.85rem;
      color: #64748B;
      margin: 0 0 0.6rem 0;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .row-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .tag-place { background: #f1f5f9; color: #475569; }
    .tag-time { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .tag-custom { background: var(--color-key-light); color: var(--color-key); border: 1px solid rgba(141, 174, 75, 0.2); }

    .row-arrow {
      margin-left: 1rem;
      color: #94A3B8;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 55px; /* バッジの高さに合わせて中央揃え */
      transition: transform 0.2s;
    }
    .exhibit-row:hover .row-arrow {
      transform: translateX(4px);
      color: var(--color-key);
    }

    @media (max-width: 768px) {
      .row-badge { width: 45px; height: 45px; font-size: 0.9rem; margin-right: 1rem; }
      .row-arrow { height: 45px; }
      .row-title { font-size: 1.05rem; }
    }

    /* ==========================================================================
       ✨ 4. モーダルウィンドウ（詳細情報）
       ========================================================================== */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(19, 25, 36, 0.7); backdrop-filter: blur(5px);
      z-index: 2000; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; padding: 1.25rem;
    }
    .modal-overlay.active {
      opacity: 1; pointer-events: auto;
    }
    .modal-window {
      background: var(--color-white); border-radius: 20px;
      width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2); position: relative;
    }
    
    .modal-header {
      padding: 1.5rem;
      position: sticky; top: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px);
      border-bottom: 1px solid var(--color-contrast); z-index: 10;
      display: flex; align-items: flex-start; gap: 1rem;
    }
    .modal-close-btn {
      background: #F1F5F9; border: none; width: 32px; height: 32px; border-radius: 50%;
      color: #64748B; font-weight: bold; font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .modal-header-content { flex: 1; min-width: 0; }
    .modal-title { font-size: 1.3rem; font-weight: 900; color: var(--color-primary-dark); margin: 0; line-height: 1.3; }
    
    .modal-body { padding: 1.5rem; }
    .modal-desc { font-size: 0.95rem; line-height: 1.7; color: #334155; margin-bottom: 1.5rem; }
    
    .modal-meta-bar {
      display: flex; gap: 1rem; flex-wrap: wrap;
      background: var(--color-bg-light); padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem;
    }
    .meta-item { font-size: 0.85rem; font-weight: 700; color: var(--color-primary); display: flex; align-items: center; gap: 0.3rem; }
    
    /* Q&Aや注意事項のブロック */
    .detail-block {
      margin-bottom: 1.5rem;
    }
    .detail-block h4 {
      font-size: 0.95rem; font-weight: 800; color: var(--color-primary);
      margin: 0 0 0.5rem 0; padding-left: 10px; border-left: 4px solid var(--color-key);
    }
    .detail-block p {
      font-size: 0.9rem; color: #475569; margin: 0; line-height: 1.6;
      background: var(--color-white); border: 1px solid var(--color-contrast); padding: 1rem; border-radius: 8px;
    }
    
    /* ⚠️ 注意事項専用デザイン */
    .detail-block.alert h4 { border-left-color: #E53E3E; color: #C53030; }
    .detail-block.alert p { background: #FFF5F5; border-color: #FEB2B2; color: #9B2C2C; }

    footer { background-color: var(--color-primary-dark); color: rgba(255, 255, 255, 0.7); padding: 3rem 1.25rem 2rem; border-top: 1px solid rgba(255, 255, 255, 0.06); text-align: center; }
  </style>
</head>
<body>

  <header class="main-header-modern">
    <div class="header-content">
      <a href="index.html" class="header-title">
        <p>第70回 屋代高校文化祭</p>
        <h1>鳩祭</h1>
      </a>
      <button class="menu-trigger" id="menuToggle" aria-label="メニューを開閉する">
        <span></span><span></span><span></span>
      </button>
      <nav class="fullscreen-nav" id="mobileNav">
        <ul class="nav-links">
          <li><a href="index.html">ホーム</a></li>
          <li><a href="exhibit.html" class="active">展示紹介</a></li>
          <li><a href="timetable.html">タイムテーブル</a></li>
          <li><a href="map.html">マップ</a></li>
        </ul>
      </nav>
      <nav class="pc-nav">
        <ul class="pc-nav-links">
          <li><a href="index.html">ホーム</a></li>
          <li><a href="exhibit.html" class="active">展示紹介</a></li>
          <li><a href="timetable.html">タイムテーブル</a></li>
          <li><a href="map.html">マップ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="page-container">
    <div class="page-hero animate__animated animate__fadeIn">
      <h2>クラス・班企画一覧</h2>
      <p>各クラスが趣向を凝らした展示やアトラクション。タップして詳細をチェック！</p>
    </div>

    <div class="filter-tabs animate__animated animate__fadeInUp">
      <button class="filter-tab-btn active" data-filter="all">すべて</button>
      <button class="filter-tab-btn" data-filter="high1">高1</button>
      <button class="filter-tab-btn" data-filter="high2">高2</button>
      <button class="filter-tab-btn" data-filter="high3">高3</button>
      <button class="filter-tab-btn" data-filter="jhs">附属中</button>
    </div>

    <div class="exhibit-list" id="exhibitList">
      </div>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-window" id="modalWindow">
      
      <div class="modal-header">
        <div id="modalBadge" class="row-badge" style="margin:0; width:50px; height:50px; font-size:1rem;"></div>
        <div class="modal-header-content">
          <h3 class="modal-title" id="modalTitle">企画タイトル</h3>
        </div>
        <button class="modal-close-btn" id="modalClose">✕</button>
      </div>
      
      <div class="modal-body">
        <div class="modal-meta-bar">
          <div class="meta-item">📍 場所: <span id="modalPlace">---</span></div>
          <div class="meta-item">⏱ 所要時間: <span id="modalTime">---</span></div>
        </div>
        
        <p class="modal-desc" id="modalDesc">企画の概要説明がここに入ります。</p>
        
        <div id="modalDetailsArea"></div>
      </div>
    </div>
  </div>

  <footer>
    <p style="font-size: 0.8rem; margin: 0;">© 2026 Yashiro High School Hatosai Festival. All Rights Reserved.</p>
  </footer>

  <script>
    // ==========================================================================
    // 🗃️ 1. データ定義（後から編集しやすいJSON形式）
    // category: high1, high2, high3, jhs （学年の色分けやフィルターに使用）
    // details: labelに「注意」が含まれると自動的に赤文字の警告デザインになります
    // ==========================================================================
    const exhibitData = [
      {
        id: "class2-1",
        category: "high2",
        className: "2-1",
        title: "トムとジェリー〜ジェリーになってチーズを持ち帰れ！〜",
        desc: "参加者がジェリーになって家の中にいる人間やトムから逃げながらチーズを手に入れる。",
        place: "2-1教室 (213教室)",
        time: "5分",
        tags: ["アトラクション", "少人数"],
        details: [
          { label: "人数について", text: "一般公開時は1〜3人で入ってもらう予定です。" },
          { label: "注意事項", text: "しゃがむアトラクションがあります。\n演出上少しだけ暗くなるので気をつけてください。" }
        ]
      },
      {
        id: "class2-B",
        category: "jhs",
        className: "2-B",
        title: "廃校の七不思議",
        desc: "舞台は、廃校。探偵である企画の参加者は、七不思議が存在していると噂されている廃校の調査を依頼された。参加者は廃校内を探索して、七不思議を探す。制限時間は、5分。廃校内を巡回しているお化けに見つかったら退場。",
        place: "2-B組教室",
        time: "3〜5分程度",
        tags: ["ホラー", "ミステリー", "探索"],
        details: [
          { label: "開催時間", text: "9時半から開始" },
          { label: "Q. この企画は怖いですか？", text: "A. ホラーよりもミステリー要素を優先しているので、多少怖い部分もありますが、多くの人に楽しんでいただけます。" },
          { label: "お願いと注意事項", text: "・壁を制作する予定なので、寄りかかったり、叩いたりしないようにしてください。\n・オブジェクトを壊さないでください。\n・廃校内を巡回しているお化けに影響を与えないでください。\n・ルールを守って楽しんでください。" }
        ]
      },
      // 👇 他のクラスのデータを追加する場合はここをコピペして編集するだけ！
      {
        id: "class1-1",
        category: "high1",
        className: "1-1",
        title: "謎解き脱出ゲーム「封印された教室」",
        desc: "クラス内に散りばめられた暗号を解き明かし、制限時間内に教室から脱出せよ！",
        place: "1-1教室",
        time: "約10分",
        tags: ["謎解き", "頭脳系"],
        details: [
          { label: "参加人数", text: "1グループ最大4名まで" }
        ]
      }
    ];

    // ==========================================================================
    // 📱 2. ナビゲーションメニュー制御
    // ==========================================================================
    const menuToggle = document.getElementById('menuToggle');
    const mobileNav = document.getElementById('mobileNav');
    menuToggle.addEventListener('click', () => {
      const isOpen = mobileNav.classList.contains('is-open');
      menuToggle.classList.toggle('is-active', !isOpen);
      mobileNav.classList.toggle('is-open', !isOpen);
    });

    // ==========================================================================
    // 🎨 3. リスト描画＆フィルター処理
    // ==========================================================================
    const listContainer = document.getElementById('exhibitList');

    function renderList(filter) {
      listContainer.innerHTML = '';
      
      const filteredData = exhibitData.filter(item => filter === 'all' || item.category === filter);
      
      if(filteredData.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 3rem; color: #64748b; font-weight:bold;">この学年の企画はまだ登録されていません。</div>';
        return;
      }
      
      filteredData.forEach(item => {
        // カスタムタグの生成
        const customTagsHtml = item.tags ? item.tags.map(t => `<span class="tag tag-custom">${t}</span>`).join('') : '';
        
        const row = document.createElement('div');
        row.className = 'exhibit-row';
        row.onclick = () => openModal(item);
        
        row.innerHTML = `
          <div class="row-badge badge-${item.category}">${item.className}</div>
          <div class="row-content">
            <h3 class="row-title">${item.title}</h3>
            <p class="row-desc">${item.desc}</p>
            <div class="row-tags">
              <span class="tag tag-place">📍 ${item.place}</span>
              <span class="tag tag-time">⏱ ${item.time}</span>
              ${customTagsHtml}
            </div>
          </div>
          <div class="row-arrow">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </div>
        `;
        listContainer.appendChild(row);
      });
      
      // Anime.jsでフワッと表示
      anime({
        targets: '.exhibit-row',
        opacity: [0, 1],
        translateY: [15, 0],
        duration: 400,
        delay: anime.stagger(40),
        easing: 'easeOutQuad'
      });
    }

    // タブのクリックイベント
    const tabBtns = document.querySelectorAll('.filter-tab-btn');
    tabBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        tabBtns.forEach(b => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
        const filterValue = e.currentTarget.getAttribute('data-filter');
        
        // リスト全体をフェードアウトさせてから再描画
        anime({
          targets: '.exhibit-row',
          opacity: 0,
          translateY: 5,
          duration: 150,
          easing: 'easeInQuad',
          complete: () => renderList(filterValue)
        });
      });
    });

    // 初期化
    renderList('all');

    // ==========================================================================
    // ✨ 4. モーダルウィンドウ（詳細表示）制御
    // ==========================================================================
    const modal = document.getElementById('modalOverlay');

    function openModal(item) {
      // ヘッダー情報のセット
      const badge = document.getElementById('modalBadge');
      badge.textContent = item.className;
      badge.className = `row-badge badge-${item.category}`; // 学年の色を引き継ぐ
      
      document.getElementById('modalTitle').textContent = item.title;
      document.getElementById('modalPlace').textContent = item.place;
      document.getElementById('modalTime').textContent = item.time;
      document.getElementById('modalDesc').textContent = item.desc;
      
      // 詳細ブロック（Q&A、注意事項等）の生成
      const detailsArea = document.getElementById('modalDetailsArea');
      detailsArea.innerHTML = '';
      
      if(item.details && item.details.length > 0) {
        item.details.forEach(d => {
          const block = document.createElement('div');
          // ラベルに「注意」が含まれていたら警告色にする魔法の機能
          const isAlert = d.label.includes('注意') ? 'alert' : '';
          block.className = `detail-block ${isAlert}`;
          
          // 改行文字(\n)を <br> タグに変換して綺麗に表示
          const formattedText = d.text.replace(/\n/g, '<br>');
          block.innerHTML = `<h4>${d.label}</h4><p>${formattedText}</p>`;
          detailsArea.appendChild(block);
        });
      }
      
      // モーダルを開くアニメーション
      modal.classList.add('active');
      anime({
        targets: '.modal-window',
        translateY: [30, 0],
        scale: [0.95, 1],
        opacity: [0, 1],
        duration: 350,
        easing: 'easeOutCubic'
      });
    }

    function closeModal() {
      anime({
        targets: '.modal-window',
        translateY: [0, 20],
        opacity: [1, 0],
        scale: [1, 0.95],
        duration: 250,
        easing: 'easeInQuad',
        complete: () => modal.classList.remove('active')
      });
    }

    document.getElementById('modalClose').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

  </script>
</body>
</html>
