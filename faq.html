  <style>

<body>
  <div class="container">
    <header>
      <h1>よくある質問</h1>

    <section class="faq-item">
      <h2>Q: 鳩祭はいつ開催されますか？</h2>
      <p>A: 鳩祭は毎年秋に開催されます。具体的な日程は公式アナウンスを確認してください。</p>
    </section>

    <section class="faq-item">
      <h2>Q: 入場は無料ですか？</h2>
      <p>A: 基本的に入場は無料ですが、特別イベントやワークショップには参加費がかかる場合があります。</p>
    </section>

    <section class="faq-item">
      <h2>Q: 駐車場やアクセス方法はどうなっていますか？</h2>
      <p>A: 駐車場は限りがあります。公共交通機関を利用するか、事前にアクセス情報を確認してください。</p>
    </section>

    <section class="faq-item">
      <h2>Q: どのようなプログラムがありますか？</h2>
      <p>A: 音楽ステージ、展示、飲食ブース、ワークショップなど、さまざまな企画があります。</p>
    </section>
